:root{--ground:#14110e;--lime:#f1eadb;--blue:#2f6f9f;--red:#a8432b;--ochre:#d6a443;--carbon:#0c0a09;--muted:#e2d8c4;
  --display:"Cormorant SC","Iowan Old Style",Palatino,"Palatino Linotype",serif;--text:"Alegreya Sans","Gill Sans","Gill Sans MT","Trebuchet MS",sans-serif}
html,body{margin:0;height:100%;background:var(--ground);overflow:hidden;color:var(--lime);font-family:var(--text)}
canvas{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;cursor:grab;touch-action:none;outline:none}
canvas:focus-visible{outline:1px solid var(--ochre);outline-offset:-4px}
body.still canvas{position:static;display:block;width:960px;height:600px}
body.still .chrome{display:none!important}
/* Words over a painting that runs from noon glare to night: pale ink inside a tight dark halo, and no panel. */
.chrome{position:fixed;pointer-events:none;text-shadow:0 0 2px rgba(12,10,9,.98),0 0 5px rgba(12,10,9,.95),0 0 9px rgba(12,10,9,.9),0 0 18px rgba(12,10,9,.8),0 1px 2px rgba(12,10,9,.95);transition:opacity .6s}
.gone{opacity:0}
#keys{top:24px;left:24px;display:grid;grid-template-columns:repeat(3,20px);gap:3px;opacity:1;text-shadow:none}
#keys i{font:500 10px/18px var(--text);font-style:normal;letter-spacing:.04em;text-align:center;color:var(--lime);background:rgba(12,10,9,.62);border:1px solid rgba(241,234,219,.78);border-radius:2px;height:18px;transition:background .15s,color .15s}
#keys i:first-child{grid-column:2}
#keys i:nth-child(2){grid-column:1}
#keys i[data-s="jump"]{grid-column:1/3;font-size:8px;letter-spacing:.1em}
#keys i.on{background:var(--lime);color:var(--carbon);border-color:var(--lime)}
@media (hover:none){#keys{display:none}}
#where{top:105px;left:24px;opacity:0}
@media (hover:none){#where{top:24px}}
#where.fade{animation:show 6.5s both}
@keyframes show{0%{opacity:0}12%,80%{opacity:1}100%{opacity:0}}
#place{font:500 20px/1.2 var(--display);letter-spacing:.18em;text-transform:uppercase}
#gloss{font:400 14px/1.45 var(--text);color:var(--muted);letter-spacing:.02em;margin-top:4px}
#title{left:0;right:0;bottom:22vh;text-align:center;animation:rise 1.4s 3s both}
@keyframes rise{from{opacity:0}to{opacity:1}}
#title.gone{animation:none;opacity:0} /* a finished animation holds its last frame over any class, so the fade must end it */
#title h1{margin:0;font:500 clamp(28px,5vw,44px)/1.1 var(--display);letter-spacing:.22em;text-transform:uppercase}
#title p{margin:10px 0 0;font:400 14px/1.45 var(--text);color:var(--muted);letter-spacing:.06em}
#title .touch{display:none;color:var(--lime)}
@media (hover:none){#title .touch{display:block}}
#stick{width:92px;height:92px;margin:-46px 0 0 -46px;border:1px solid rgba(241,234,219,.6);border-radius:50%;background:rgba(12,10,9,.22)}
#stick[hidden]{display:none}
#stick i{position:absolute;left:28px;top:28px;width:36px;height:36px;border-radius:50%;background:rgba(241,234,219,.8)}
#rail{left:50%;bottom:28px;transform:translateX(-50%);pointer-events:auto;display:flex;align-items:center;gap:12px;font:500 12px/1 var(--text);letter-spacing:.06em;color:var(--muted)}
#tools{right:24px;bottom:22px;display:flex;gap:18px}
#tools button{pointer-events:auto;background:none;border:0;padding:6px 0;cursor:pointer;font:500 12px/1 var(--text);letter-spacing:.06em;color:var(--muted)}
#tools button:focus-visible{outline:1px solid var(--ochre);outline-offset:4px}
#ledger[aria-pressed="true"]{color:var(--lime);text-decoration:underline;text-underline-offset:4px}
#lens{top:22px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;max-width:calc(100vw - 220px);font:500 12px/1.3 var(--text);letter-spacing:.06em;color:var(--muted)}
#lens[hidden]{display:none}
#lens b{font-weight:500;color:var(--lime);letter-spacing:.16em;text-transform:uppercase}
#lens i{font-style:normal;white-space:nowrap}
#lens i::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:var(--c)}
#lens a{pointer-events:auto;color:var(--lime);text-underline-offset:3px}
#read{left:50%;bottom:64px;transform:translateX(-50%);pointer-events:auto;background:none;border:0;padding:6px 0;cursor:pointer;font:500 13px/1 var(--text);letter-spacing:.08em;color:var(--lime);white-space:nowrap}
#read:focus-visible{outline:1px solid var(--ochre);outline-offset:4px}
#prayer{left:0;right:0;top:59vh;padding:0 24px;text-align:center}
#prayer .pv{font:500 12px/1.3 var(--text);letter-spacing:.16em;color:var(--muted)}
#prayer .pr{font:italic 400 26px/1.3 "Iowan Old Style",Palatino,"Palatino Linotype",serif;margin-top:6px}
#prayer .pg{font:400 15px/1.45 var(--text);margin-top:4px}
#prayer .pk{font:500 11px/1.3 var(--text);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
#prayer .pt{font:400 20px/1.5 "Iowan Old Style",Palatino,"Palatino Linotype",serif;max-width:44ch;margin:0 auto}
#sound[aria-pressed="false"]{text-decoration:line-through;opacity:.7}
#hour{appearance:none;-webkit-appearance:none;width:220px;height:20px;background:transparent;margin:0;cursor:ew-resize}
#hour::-webkit-slider-runnable-track{height:1px;background:var(--muted)}
#hour::-moz-range-track{height:1px;background:var(--muted)}
#hour::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;background:var(--ochre);margin-top:-4px}
#hour::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--ochre)}
#hour:focus-visible{outline:1px solid var(--ochre);outline-offset:4px}
#rail,#tools button,#lens,#gloss,#title p{font-weight:500}
@media (max-width:640px),(pointer:coarse){
  #rail{bottom:max(14px,env(safe-area-inset-bottom))}
  #tools{top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));bottom:auto;gap:4px}
  #tools button,#read{min-width:44px;min-height:44px;padding:10px;font-size:14px}
  #where{top:max(20px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));max-width:calc(100vw - 172px)}
  #lens{top:max(64px,calc(env(safe-area-inset-top) + 54px));max-width:calc(100vw - 32px)}
  body.lens-open #where{opacity:0!important;animation:none}
  #hour{height:44px}
}
@media (prefers-reduced-motion:reduce){.chrome{transition:none}#title{animation:none}#where.fade{animation:none;opacity:1}}
</style>

// --- 9. CHUNKS: the near field is built once per chunk from a seed hashed from its coordinates ---
const CHUNK = 20, RADIUS = 4, CELLS = 5, chunks = new Map();
const QWASH_BASE = 600000000; // quad-wash ids, above every chunk block and below 2^31
const COURT_ANG = atan2(PL[1], PL[0]); // ground strokes on the palace platform run with its grid
function buildChunk(cx, cz) {
  const rand = rng(hash(cx, cz, 9001)), x0 = cx * CHUNK, z0 = cz * CHUNK, step = CHUNK / CELLS;
  // Each chunk owns a block of 2048 ids packed from its coordinates: 240 ground strokes, then 32 per plant.
  // The map spans fewer than 128 chunks each way, so blocks never collide. Washes take a block of 64 at QWASH_BASE.
  const slot = ((cx + 64) & 127) * 128 + ((cz + 64) & 127), base = 1000000 + slot * 2048;
  const quads = [], strokes = [], plants = [];
  const corner = (x, z) => { const y = height(x, z); return y < WATER ? waterColor(x, z) : landColor(x, z, y); };
  for (let iz = 0; iz < CELLS; iz++) for (let ix = 0; ix < CELLS; ix++) {
    const x = x0 + ix * step, z = z0 + iz * step, xm = x + step / 2, zm = z + step / 2;
    if (insideStructure(xm, zm, -1.5)) continue; // ground under a roof is never seen, and would paint over the wall's foot
    const water = height(xm, zm) < WATER;
    quads.push({
      pts: [[x, groundY(x, z), z], [x + step, groundY(x + step, z), z], [x + step, groundY(x + step, z + step), z + step], [x, groundY(x, z + step), z + step]],
      xm, zm, water, c0: corner(x, z), c2: corner(x + step, z + step), // opposite corners, for a gradient fill
      wid: QWASH_BASE + slot * 64 + (iz * CELLS + ix) * 2,
    });
  }
  for (let i = 0; i < 240; i++) { // ground strokes: world-anchored paint that carries the terrain's colour and grain
    const x = x0 + rand() * CHUNK, z = z0 + rand() * CHUNK, r1 = rand(), r2 = rand(), r3 = rand(), r4 = rand(), r5 = rand();
    if (insideStructure(x, z, -0.5)) continue;
    const y = height(x, z), sea = y < WATER;
    valley(GORGE, x, z);
    const water = sea || (V.s > 3.3 && V.s < 12.4 && V.d < 2.1 && padWeight(x, z) <= 0);
    const gx = (height(x + 1, z) - height(x - 1, z)) / 2, gz = (height(x, z + 1) - height(x, z - 1)) / 2;
    const ang = water ? 0 : padWeight(x, z) > 0.6 ? COURT_ANG + (r1 - 0.5) * 0.3 : hypot(gx, gz) > 0.3 ? atan2(gz, gx) + PI / 2 : sin(x * 0.08 + z * 0.06) * 0.7; // follow contours on slopes
    // The stream is brushwork only: blue strokes over a pale gravel bed, never a filled quad, so it stays a thread of water.
    const half = 1.1 + r1 * 0.9, dx = cos(ang) * half, dz = sin(ang) * half, col = sea ? waterColor(x, z) : water ? STREAM_COL : landColor(x, z, y);
    strokes.push({
      id: base + i, x, y: max(y, WATER) + 0.05, z, dx, dz, dy: groundY(x + dx, z + dz) - max(y, WATER), wid: 0.6 + r2 * 0.5, water,
      col: [col[0] + (r3 - 0.5) * 16, col[1] + (r4 - 0.5) * 14, col[2] + (r5 - 0.5) * 14],
    });
  }
  for (let i = 0; i < 56; i++) {
    const x = x0 + rand() * CHUNK, z = z0 + rand() * CHUNK, r = rand(), rs = rand(), rv = rand();
    if (insideStructure(x, z, 1.2)) continue;
    if (LIFE.some((L) => L.prayer && hypot(L.x - x, L.z - z) < 4.5)) continue; // nothing grows over an inscribed thing
    const q = zoneAt(x, z), kind = plantFor(q, r);
    if (!kind) continue;
    const S = TREES[kind] || FLOWERS[kind], size = S ? S.size : kind === 'palm' ? [6, 9.5] : kind === 'cushion' ? [0.3, 0.7] : kind === 'vine' ? [0.9, 1.3] : kind === 'reed' ? [1.2, 2] : [0.35, 0.8];
    plants.push({ id: base + 256 + i * 32, kind, cls: plantClass(kind), x, y: q.y, z, h: lerp(size[0], size[1], rs), v: floor(rv * 997) });
  }
  return { cx, cz, x0, z0, quads, strokes, plants };
}
// The ground as painted: each 4 m quad joins its corners, so in a crease (a terrace foot, a cliff foot) the painted
// surface stands above the true height. A low eye must stay above it, or it sees the near quad from below.
function paintedGroundY(x, z) {
  const s = CHUNK / CELLS, gx = x / s, gz = z / s, x0 = floor(gx) * s, z0 = floor(gz) * s, u = gx - floor(gx), v = gz - floor(gz);
  return lerp(lerp(groundY(x0, z0), groundY(x0 + s, z0), u), lerp(groundY(x0, z0 + s), groundY(x0 + s, z0 + s), u), v);
}
function ensureChunks(px, pz) {
  const pcx = floor(px / CHUNK), pcz = floor(pz / CHUNK);
  for (let dz = -RADIUS; dz <= RADIUS; dz++) for (let dx = -RADIUS; dx <= RADIUS; dx++) {
    const key = `${pcx + dx},${pcz + dz}`;
    if (!chunks.has(key)) chunks.set(key, buildChunk(pcx + dx, pcz + dz));
  }
  for (const [key, ch] of chunks) if (abs(ch.cx - pcx) > RADIUS + 1 || abs(ch.cz - pcz) > RADIUS + 1) chunks.delete(key);
}

// --- 10. FAR LAYER: sky, sun and moon, then a ring-and-column horizon grid, painted to its own canvas and reused ---

function update(dt) {

// ===== 85-sound.js =====
// --- 14. SOUND: a synthesized soundscape. Pink noise through filters, and a few tones. No audio files ---
// Each layer is the same looping noise buffer shaped by its own filter. Its loudness follows where the walker stands
// and the hour: surf by the bay, wind on the upland and through the narrows, the stream, cicadas in the day's heat,
